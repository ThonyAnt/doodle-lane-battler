<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 554" width="1100" height="554" role="img" aria-label="A typed request goes to a planner that hands work to a designer, an engineer and a tester. They pass files to each other. The update is play-tested, refused by the install tool unless the test was clean, checked again by the game server, and then installed into the running match." font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>“Make the floor lava”: from the prompt to the arena, in about 20 seconds</title><defs><marker id="m8b96ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b96ad"/></marker><marker id="m6ea0ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6ea0ff"/></marker><marker id="mbc8cff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc8cff"/></marker><marker id="me3b341" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e3b341"/></marker><marker id="m56d364" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56d364"/></marker><marker id="mff7b72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7b72"/></marker><marker id="m5d6a86" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6a86"/></marker><linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2030"/><stop offset="1" stop-color="#11151d"/></linearGradient></defs><rect x="0" y="0" width="1100" height="554" rx="18" fill="url(#board)"/><text x="24" y="36" font-size="16" font-weight="700" fill="#e8ebf2">“Make the floor lava”: from the prompt to the arena, in about 20 seconds</text><rect x="416" y="96" width="668" height="190" rx="13" fill="none" stroke="#5d6a86" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.9"/><rect x="24" y="116" width="176" height="78" rx="9" fill="#1b2130" stroke="#6ea0ff" stroke-width="1.6"/><text x="112" y="151.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">INK-OS prompt</text><text x="112" y="167.5" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e8ebf2">C:\&gt; make the floor lava</text><rect x="232" y="116" width="160" height="78" rx="9" fill="#1b2130" stroke="#56d364" stroke-width="1.6"/><text x="312" y="144.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">Planner</text><text x="312" y="160.5" text-anchor="middle" font-size="11" fill="#9aa5bd">plans with write_todos</text><text x="312" y="174.5" text-anchor="middle" font-size="11" fill="#9aa5bd">hands out the work</text><rect x="432" y="116" width="188" height="78" rx="9" fill="#1b2130" stroke="#56d364" stroke-width="1.6"/><text x="526" y="144.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">designer</text><text x="526" y="160.5" text-anchor="middle" font-size="11" fill="#9aa5bd">what it should feel like</text><text x="526" y="174.5" text-anchor="middle" font-size="11" fill="#9aa5bd">the numbers to try</text><rect x="648" y="116" width="200" height="78" rx="9" fill="#1b2130" stroke="#56d364" stroke-width="1.6"/><text x="748" y="144.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">engineer</text><text x="748" y="160.5" text-anchor="middle" font-size="11" fill="#9aa5bd">settings, rules and a look</text><text x="748" y="174.5" text-anchor="middle" font-size="11" fill="#9aa5bd">save_update checks the file</text><rect x="876" y="116" width="192" height="78" rx="9" fill="#1b2130" stroke="#56d364" stroke-width="1.6"/><text x="972" y="144.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">tester</text><text x="972" y="160.5" text-anchor="middle" font-size="11" fill="#9aa5bd">40 bot rounds with the update,</text><text x="972" y="174.5" text-anchor="middle" font-size="11" fill="#9aa5bd">the same 40 without</text><path d="M 200 155 L 230 155" fill="none" stroke="#8b96ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8b96ad)"/><path d="M 392 155 L 430 155" fill="none" stroke="#56d364" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m56d364)"/><rect x="466" y="226" width="120" height="26" rx="13" fill="#141926" stroke="#56d364" stroke-width="1.3"/><text x="526" y="243" text-anchor="middle" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e8ebf2">/design.md</text><rect x="688" y="226" width="120" height="26" rx="13" fill="#141926" stroke="#56d364" stroke-width="1.3"/><text x="748" y="243" text-anchor="middle" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e8ebf2">/update.json</text><rect x="907" y="226" width="130" height="26" rx="13" fill="#141926" stroke="#56d364" stroke-width="1.3"/><text x="972" y="243" text-anchor="middle" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e8ebf2">/qa-report.md</text><path d="M 526 194 L 526 224" fill="none" stroke="#56d364" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m56d364)"/><path d="M 748 194 L 748 224" fill="none" stroke="#56d364" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m56d364)"/><path d="M 972 194 L 972 224" fill="none" stroke="#56d364" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m56d364)"/><path d="M 586 239 L 668 239 L 668 196" fill="none" stroke="#56d364" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m56d364)"/><path d="M 808 239 L 896 239 L 896 196" fill="none" stroke="#56d364" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m56d364)"/><text x="533" y="213" font-size="10" fill="#9aa5bd">writes</text><text x="627" y="233" text-anchor="middle" font-size="10" fill="#9aa5bd">reads</text><text x="852" y="233" text-anchor="middle" font-size="10" fill="#9aa5bd">reads</text><text x="432" y="276" font-size="10.5" fill="#9aa5bd">three sub-agents · each has its own prompt, tools and model · work is handed over as files</text><path d="M 990 116 L 990 84 L 770 84 L 770 114" fill="none" stroke="#ff7b72" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mff7b72)"/><text x="880" y="77" text-anchor="middle" font-size="10.5" fill="#ff7b72">FAIL → one repair round</text><path d="M 972 252 L 972 312 L 312 312 L 312 196" fill="none" stroke="#8b96ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8b96ad)"/><text x="642" y="306" text-anchor="middle" font-size="10.5" fill="#9aa5bd">PASS or FAIL, with the numbers</text><path d="M 272 194 L 272 350" fill="none" stroke="#56d364" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m56d364)"/><text x="264" y="334" text-anchor="end" font-size="10.5" fill="#56d364">on PASS</text><rect x="232" y="352" width="222" height="78" rx="9" fill="#1b2130" stroke="#e3b341" stroke-width="1.6"/><text x="343" y="380.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">install_update</text><text x="343" y="396.5" text-anchor="middle" font-size="11" fill="#9aa5bd">refuses any file that has not</text><text x="343" y="410.5" text-anchor="middle" font-size="11" fill="#9aa5bd">passed a clean play-test (hash)</text><rect x="486" y="352" width="206" height="78" rx="9" fill="#1b2130" stroke="#e3b341" stroke-width="1.6"/><text x="589" y="380.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">Game server gate</text><text x="589" y="396.5" text-anchor="middle" font-size="11" fill="#9aa5bd">checks the update again,</text><text x="589" y="410.5" text-anchor="middle" font-size="11" fill="#9aa5bd">its own 10-round play-test</text><rect x="724" y="352" width="168" height="78" rx="9" fill="#1b2130" stroke="#6ea0ff" stroke-width="2.2"/><text x="808" y="380.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">The match</text><text x="808" y="396.5" text-anchor="middle" font-size="11" fill="#9aa5bd">live at once, in any phase</text><text x="808" y="410.5" text-anchor="middle" font-size="11" fill="#9aa5bd">floor, weather and tint</text><rect x="924" y="352" width="152" height="78" rx="9" fill="#1b2130" stroke="#6ea0ff" stroke-width="1.6"/><text x="1000" y="380.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">Every screen</text><text x="1000" y="396.5" text-anchor="middle" font-size="11" fill="#9aa5bd">phones and the</text><text x="1000" y="410.5" text-anchor="middle" font-size="11" fill="#9aa5bd">big screen are told</text><path d="M 454 391 L 484 391" fill="none" stroke="#8b96ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8b96ad)"/><path d="M 692 391 L 722 391" fill="none" stroke="#8b96ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8b96ad)"/><path d="M 892 391 L 922 391" fill="none" stroke="#8b96ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8b96ad)"/><rect x="24" y="458" width="1052" height="60" rx="9" fill="#141926" stroke="#5d6a86" stroke-width="1.2"/><text x="40" y="481" font-size="11.5" font-weight="700" fill="#e8ebf2">Shipped for “make the floor lava”</text><text x="1060" y="481" text-anchor="end" font-size="11" fill="#9aa5bd">play-test: rounds 40 s → 32 s</text><text x="40" y="502" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#56d364">jump ×1.5 · rule: if (!me.air) { hurt(me, 5); burst(me.x, 4, 6); say('HOT!'); } · look: lava, embers</text><text x="1060" y="502" text-anchor="end" font-size="11" fill="#9aa5bd">rule fired 28× a round, evenly for both sides</text><text x="1036.1" y="537" font-size="10.5" fill="#9aa5bd">refusal</text><rect x="1022.0999999999999" y="528" width="9" height="9" rx="2" fill="#ff7b72"/><text x="884.3999999999999" y="537" font-size="10.5" fill="#9aa5bd">the game's own checks</text><rect x="870.3999999999999" y="528" width="9" height="9" rx="2" fill="#e3b341"/><text x="795.3999999999999" y="537" font-size="10.5" fill="#9aa5bd">deep agent</text><rect x="781.3999999999999" y="528" width="9" height="9" rx="2" fill="#56d364"/><text x="700.6999999999998" y="537" font-size="10.5" fill="#9aa5bd">player side</text><rect x="686.6999999999998" y="528" width="9" height="9" rx="2" fill="#6ea0ff"/></svg>
