<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 542" width="1100" height="542" role="img" aria-label="At the knockout a planner starts a scout and an armorer at the same time. The scout writes the player file and a note that outlives the match. The armorer forges a build and its tool spars it against a copy of the player. The first build that wins is given to Red, and the round opens with a taunt." font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Nemesis: from a knockout to the next round</title><defs><marker id="m8b96ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b96ad"/></marker><marker id="m6ea0ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6ea0ff"/></marker><marker id="mbc8cff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc8cff"/></marker><marker id="me3b341" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e3b341"/></marker><marker id="m56d364" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56d364"/></marker><marker id="mff7b72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7b72"/></marker><marker id="m5d6a86" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6a86"/></marker><linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2030"/><stop offset="1" stop-color="#11151d"/></linearGradient></defs><rect x="0" y="0" width="1100" height="542" rx="18" fill="url(#board)"/><text x="24" y="36" font-size="16" font-weight="700" fill="#e8ebf2">Nemesis: from a knockout to the next round</text><text x="24" y="58" font-size="11.5" fill="#9aa5bd">About 6 seconds from the knockout to a decision. The first version ran three sub-agents in a row and took about 25.</text><rect x="24" y="150" width="150" height="78" rx="9" fill="#1b2130" stroke="#ff7b72" stroke-width="1.6"/><text x="99" y="178.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">Knockout</text><text x="99" y="194.5" text-anchor="middle" font-size="11" fill="#9aa5bd">the round's numbers</text><text x="99" y="208.5" text-anchor="middle" font-size="11" fill="#9aa5bd">are in; work starts</text><rect x="204" y="150" width="196" height="78" rx="9" fill="#1b2130" stroke="#e3b341" stroke-width="1.6"/><text x="302" y="171.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">What it saw</text><text x="302" y="187.5" text-anchor="middle" font-size="11" fill="#9aa5bd">far / mid / close · in the air</text><text x="302" y="201.5" text-anchor="middle" font-size="11" fill="#9aa5bd">jumps a minute · near a wall</text><text x="302" y="215.5" text-anchor="middle" font-size="11" fill="#9aa5bd">what each weapon did</text><rect x="430" y="150" width="150" height="78" rx="9" fill="#1b2130" stroke="#56d364" stroke-width="1.6"/><text x="505" y="178.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">Planner</text><text x="505" y="194.5" text-anchor="middle" font-size="11" fill="#9aa5bd">two tasks,</text><text x="505" y="208.5" text-anchor="middle" font-size="11" fill="#9aa5bd">one turn</text><path d="M 174 189 L 202 189" fill="none" stroke="#8b96ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8b96ad)"/><path d="M 400 189 L 428 189" fill="none" stroke="#8b96ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8b96ad)"/><rect x="630" y="96" width="196" height="72" rx="9" fill="#1b2130" stroke="#56d364" stroke-width="1.6"/><text x="728" y="121.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">scout</text><text x="728" y="137.5" text-anchor="middle" font-size="11" fill="#9aa5bd">writes your file, /dossier.md</text><text x="728" y="151.5" text-anchor="middle" font-size="11" fill="#9aa5bd">files one line for next time</text><rect x="870" y="96" width="206" height="72" rx="9" fill="#1b2130" stroke="#56d364" stroke-width="1.6" stroke-dasharray="5 4"/><text x="973" y="121.5" text-anchor="middle" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e8ebf2">/memories/&lt;name&gt;.md</text><text x="973" y="137.5" text-anchor="middle" font-size="11" fill="#9aa5bd">outlives the match</text><text x="973" y="151.5" text-anchor="middle" font-size="11" fill="#9aa5bd">read before round 1 next time</text><rect x="630" y="210" width="196" height="72" rx="9" fill="#1b2130" stroke="#56d364" stroke-width="1.6"/><text x="728" y="235.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">armorer</text><text x="728" y="251.5" text-anchor="middle" font-size="11" fill="#9aa5bd">2 of 14 ready-made weapons,</text><text x="728" y="265.5" text-anchor="middle" font-size="11" fill="#9aa5bd">80 ink, 1 ability it writes</text><rect x="870" y="204" width="206" height="84" rx="9" fill="#1b2130" stroke="#e3b341" stroke-width="1.6"/><text x="973" y="228.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">forge_build</text><text x="973" y="244.5" text-anchor="middle" font-size="11" fill="#9aa5bd">legal? does the ability fire?</text><text x="973" y="258.5" text-anchor="middle" font-size="11" fill="#9aa5bd">40 rounds against a copy of you</text><text x="973" y="272.5" text-anchor="middle" font-size="11" fill="#9aa5bd">→ a win rate</text><path d="M 580 176 L 605 176 L 605 132 L 628 132" fill="none" stroke="#56d364" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m56d364)"/><path d="M 580 202 L 605 202 L 605 246 L 628 246" fill="none" stroke="#56d364" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m56d364)"/><path d="M 828 132 L 868 132" fill="none" stroke="#56d364" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m56d364)" marker-start="url(#m56d364)"/><path d="M 828 246 L 868 246" fill="none" stroke="#e3b341" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#me3b341)" marker-start="url(#me3b341)"/><path d="M 940 288 L 940 310 L 728 310 L 728 284" fill="none" stroke="#ff7b72" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mff7b72)"/><text x="834" y="326" text-anchor="middle" font-size="10.5" fill="#ff7b72">loses → forged once more</text><path d="M 1040 288 L 1040 370" fill="none" stroke="#56d364" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m56d364)"/><text x="1048" y="338" font-size="10.5" fill="#56d364">wins</text><rect x="870" y="372" width="206" height="78" rx="9" fill="#1b2130" stroke="#ff7b72" stroke-width="2.2"/><text x="973" y="400.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">Red is re-armed</text><text x="973" y="416.5" text-anchor="middle" font-size="11" fill="#9aa5bd">the first build that wins,</text><text x="973" y="430.5" text-anchor="middle" font-size="11" fill="#9aa5bd">checked again by the server</text><rect x="580" y="372" width="260" height="78" rx="9" fill="#1b2130" stroke="#ff7b72" stroke-width="1.6"/><text x="710" y="400.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">The round opens</text><text x="710" y="416.5" text-anchor="middle" font-size="11" font-style="italic" fill="#9aa5bd">“Ben, 76% still — at least your</text><text x="710" y="430.5" text-anchor="middle" font-size="11" font-style="italic" fill="#9aa5bd">aim stays perfectly predictable.”</text><rect x="310" y="372" width="240" height="78" rx="9" fill="#1b2130" stroke="#6ea0ff" stroke-width="1.6"/><text x="430" y="400.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">Match over</text><text x="430" y="416.5" text-anchor="middle" font-size="11" fill="#9aa5bd">its notes on you open on the</text><text x="430" y="430.5" text-anchor="middle" font-size="11" fill="#9aa5bd">desktop as a text file</text><rect x="24" y="372" width="256" height="78" rx="9" fill="#1b2130" stroke="#56d364" stroke-width="1.6" stroke-dasharray="5 4"/><text x="152" y="400.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">Next match</text><text x="152" y="416.5" text-anchor="middle" font-size="11" fill="#9aa5bd">it reads its notes on you and</text><text x="152" y="430.5" text-anchor="middle" font-size="11" fill="#9aa5bd">builds before round one</text><path d="M 868 411 L 842 411" fill="none" stroke="#8b96ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8b96ad)"/><path d="M 578 411 L 552 411" fill="none" stroke="#8b96ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8b96ad)"/><path d="M 308 411 L 282 411" fill="none" stroke="#8b96ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8b96ad)"/><text x="24" y="486" font-size="11" fill="#9aa5bd">A copy of you: the game’s own bot holding your weapons, as skilled as your damage says, with your habits laid over it.</text><text x="24" y="504" font-size="11" fill="#9aa5bd">Fair play: the machine gets a player’s limits, and the same code checks both.</text><text x="984.8" y="525" font-size="10.5" fill="#9aa5bd">Red, the machine</text><rect x="970.8" y="516" width="9" height="9" rx="2" fill="#ff7b72"/><text x="844.5" y="525" font-size="10.5" fill="#9aa5bd">the game's own code</text><rect x="830.5" y="516" width="9" height="9" rx="2" fill="#e3b341"/><text x="755.5" y="525" font-size="10.5" fill="#9aa5bd">deep agent</text><rect x="741.5" y="516" width="9" height="9" rx="2" fill="#56d364"/></svg>
