<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 468" width="1100" height="468" role="img" aria-label="A drawing is read by a vision model in about two seconds and built into a weapon by the rules. A second request scores how unexpected it is and writes abilities, which pass the InkScript check before they are attached." font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>One drawing, from the phone to the fight</title><defs><marker id="m8b96ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b96ad"/></marker><marker id="m6ea0ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6ea0ff"/></marker><marker id="mbc8cff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc8cff"/></marker><marker id="me3b341" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e3b341"/></marker><marker id="m56d364" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56d364"/></marker><marker id="mff7b72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7b72"/></marker><marker id="m5d6a86" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6a86"/></marker><linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2030"/><stop offset="1" stop-color="#11151d"/></linearGradient></defs><rect x="0" y="0" width="1100" height="468" rx="18" fill="url(#board)"/><text x="24" y="36" font-size="16" font-weight="700" fill="#e8ebf2">One drawing, from the phone to the fight</text><text x="309" y="70" text-anchor="middle" font-size="10.5" fill="#bc8cff">about 2 seconds</text><rect x="24" y="78" width="150" height="80" rx="9" fill="#1b2130" stroke="#6ea0ff" stroke-width="1.6"/><text x="99" y="107.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">Your phone</text><text x="99" y="123.5" text-anchor="middle" font-size="11" fill="#9aa5bd">strokes + a PNG</text><text x="99" y="137.5" text-anchor="middle" font-size="11" fill="#9aa5bd">ink spent = strength</text><rect x="204" y="78" width="210" height="80" rx="9" fill="#1b2130" stroke="#bc8cff" stroke-width="1.6"/><text x="309" y="100.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">Reader</text><text x="309" y="116.5" text-anchor="middle" font-size="11" fill="#9aa5bd">a vision model names it:</text><text x="309" y="130.5" text-anchor="middle" font-size="11" fill="#9aa5bd">kind, element, and how it leans</text><text x="309" y="144.5" text-anchor="middle" font-size="11" fill="#9aa5bd">(power / range / speed)</text><rect x="444" y="78" width="206" height="80" rx="9" fill="#1b2130" stroke="#e3b341" stroke-width="1.6"/><text x="547" y="100.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">The rules build it</text><text x="547" y="116.5" text-anchor="middle" font-size="11" fill="#9aa5bd">same stat total for every item</text><text x="547" y="130.5" text-anchor="middle" font-size="11" fill="#9aa5bd">ink sets the overall strength</text><text x="547" y="144.5" text-anchor="middle" font-size="11" fill="#9aa5bd">you pick one of two traits</text><rect x="680" y="78" width="156" height="80" rx="9" fill="#1b2130" stroke="#6ea0ff" stroke-width="2.2"/><text x="758" y="114.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">Weapon in hand</text><text x="758" y="130.5" text-anchor="middle" font-size="11" fill="#9aa5bd">playable at once</text><rect x="866" y="78" width="210" height="80" rx="9" fill="#1b2130" stroke="#e3b341" stroke-width="1.6"/><text x="971" y="107.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">The fight</text><text x="971" y="123.5" text-anchor="middle" font-size="11" fill="#9aa5bd">the server steps the rules 120×/s</text><text x="971" y="137.5" text-anchor="middle" font-size="11" fill="#9aa5bd">screens get the state 60×/s</text><path d="M 174 118 L 202 118" fill="none" stroke="#8b96ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8b96ad)"/><path d="M 414 118 L 442 118" fill="none" stroke="#8b96ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8b96ad)"/><path d="M 650 118 L 678 118" fill="none" stroke="#8b96ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8b96ad)"/><path d="M 836 118 L 864 118" fill="none" stroke="#8b96ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8b96ad)"/><text x="309" y="180" text-anchor="middle" font-size="10.5" fill="#9aa5bd">it also returns its 2nd and 3rd guess:</text><text x="309" y="194" text-anchor="middle" font-size="10.5" fill="#9aa5bd">one-tap corrections under the drawing</text><path d="M 99 158 L 99 272 L 202 272" fill="none" stroke="#bc8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mbc8cff)"/><text x="109" y="208" font-size="10.5" fill="#bc8cff">same drawing,</text><text x="109" y="222" font-size="10.5" fill="#bc8cff">a second request</text><rect x="204" y="232" width="210" height="80" rx="9" fill="#1b2130" stroke="#bc8cff" stroke-width="1.6"/><text x="309" y="254.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">Score + abilities</text><text x="309" y="270.5" text-anchor="middle" font-size="11" fill="#9aa5bd">creativity 1–10, and abilities:</text><text x="309" y="284.5" text-anchor="middle" font-size="11" fill="#9aa5bd">ready-made blocks, or a</text><text x="309" y="298.5" text-anchor="middle" font-size="11" fill="#9aa5bd">script the model writes</text><rect x="444" y="232" width="206" height="80" rx="9" fill="#1b2130" stroke="#e3b341" stroke-width="1.6"/><text x="547" y="254.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">InkScript check</text><text x="547" y="270.5" text-anchor="middle" font-size="11" fill="#9aa5bd">parsed · every name on a list</text><text x="547" y="284.5" text-anchor="middle" font-size="11" fill="#9aa5bd">no loops, no functions</text><text x="547" y="298.5" text-anchor="middle" font-size="11" fill="#9aa5bd">600 characters at most</text><rect x="680" y="232" width="156" height="80" rx="9" fill="#1b2130" stroke="#6ea0ff" stroke-width="1.6"/><text x="758" y="261.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">Abilities attached</text><text x="758" y="277.5" text-anchor="middle" font-size="11" fill="#9aa5bd">0, 1, 2 or 3,</text><text x="758" y="291.5" text-anchor="middle" font-size="11" fill="#9aa5bd">by the score</text><rect x="866" y="232" width="210" height="80" rx="9" fill="#1b2130" stroke="#e3b341" stroke-width="1.6"/><text x="971" y="254.5" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ebf2">During the fight</text><text x="971" y="270.5" text-anchor="middle" font-size="11" fill="#9aa5bd">the match clamps every effect</text><text x="971" y="284.5" text-anchor="middle" font-size="11" fill="#9aa5bd">three faults switch a script off</text><text x="971" y="298.5" text-anchor="middle" font-size="11" fill="#9aa5bd">(“ability fizzled”)</text><path d="M 414 272 L 442 272" fill="none" stroke="#8b96ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8b96ad)"/><path d="M 650 272 L 678 272" fill="none" stroke="#8b96ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8b96ad)"/><path d="M 836 272 L 864 272" fill="none" stroke="#8b96ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m8b96ad)"/><path d="M 806 232 L 806 160" fill="none" stroke="#6ea0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6ea0ff)"/><text x="797" y="199" text-anchor="end" font-size="10.5" fill="#6ea0ff">added when they arrive</text><text x="547" y="330" text-anchor="middle" font-size="10.5" fill="#ff7b72">fails the check → dropped; a built-in ability stands in</text><text x="24" y="380" font-size="12.5" font-weight="700" fill="#e8ebf2">Creativity score</text><text x="24" y="396" font-size="10.5" fill="#9aa5bd">how unexpected the idea is,</text><text x="24" y="410" font-size="10.5" fill="#9aa5bd">never how well it is drawn</text><rect x="204" y="358" width="210" height="60" rx="9" fill="#141926" stroke="#5d6a86" stroke-width="1.2"/><text x="220" y="396" font-size="21" font-weight="700" fill="#bc8cff">1–3</text><text x="282" y="385" font-size="12" font-weight="700" fill="#e8ebf2">no abilities</text><text x="282" y="402" font-size="10.5" fill="#9aa5bd">a plain sword, a stick</text><rect x="424.7" y="358" width="210" height="60" rx="9" fill="#141926" stroke="#5d6a86" stroke-width="1.2"/><text x="440.7" y="396" font-size="21" font-weight="700" fill="#bc8cff">4–6</text><text x="502.7" y="385" font-size="12" font-weight="700" fill="#e8ebf2">one ability</text><text x="502.7" y="402" font-size="10.5" fill="#9aa5bd">a cooler ordinary weapon</text><rect x="645.4" y="358" width="210" height="60" rx="9" fill="#141926" stroke="#5d6a86" stroke-width="1.2"/><text x="661.4" y="396" font-size="21" font-weight="700" fill="#bc8cff">7–8</text><text x="723.4" y="385" font-size="12" font-weight="700" fill="#e8ebf2">two abilities</text><text x="723.4" y="402" font-size="10.5" fill="#9aa5bd">a fish on a stick, a cat</text><rect x="866.0999999999999" y="358" width="210" height="60" rx="9" fill="#141926" stroke="#5d6a86" stroke-width="1.2"/><text x="882.0999999999999" y="396" font-size="21" font-weight="700" fill="#bc8cff">9–10</text><text x="944.0999999999999" y="385" font-size="12" font-weight="700" fill="#e8ebf2">three abilities</text><text x="944.0999999999999" y="402" font-size="10.5" fill="#9aa5bd">rare: truly out of pocket</text><text x="967.7" y="451" font-size="10.5" fill="#9aa5bd">the game's own code</text><rect x="953.7" y="442" width="9" height="9" rx="2" fill="#e3b341"/><text x="878.7" y="451" font-size="10.5" fill="#9aa5bd">model call</text><rect x="864.7" y="442" width="9" height="9" rx="2" fill="#bc8cff"/><text x="812.5" y="451" font-size="10.5" fill="#9aa5bd">player</text><rect x="798.5" y="442" width="9" height="9" rx="2" fill="#6ea0ff"/></svg>
